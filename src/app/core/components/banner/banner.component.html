<div class="relative h-screen w-full overflow-hidden">
  <!-- Background Video -->
  <iframe 
    class="w-full h-full absolute top-0 left-0 object-cover"
    [src]="safeVideoUrl"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen
  ></iframe>
  
  <!-- Gradient Overlay -->
  <div class="absolute top-0 left-0 w-full h-screen bg-gradient-to-r from-black"></div>
  
  <!-- Content -->
  <div class="absolute top-0 left-0 w-full h-full flex flex-col justify-center px-12">
    <h1 class="text-6xl font-bold text-white mb-4">{{ bannerTitle }}</h1>
    <p class="text-xl text-white w-1/4 mb-6">{{ bannerOverview }}</p>
    
    <!-- Buttons -->
    <div class="flex space-x-4">
      <button class="px-6 py-2 bg-white text-black font-semibold rounded hover:opacity-80 transition duration-300">
        Play
      </button>
      <button class="px-6 py-2 bg-gray-500 text-white bg-opacity-50 font-semibold rounded hover:bg-opacity-70 transition duration-300">
        More Info
      </button>
    </div>
  </div>
</div>
