<section class="w-full bg-[#141414] text-neutral-200">
  <!-- Hero Banner -->
  <app-banner
    [bannerTitle]="movie.title"
    [bannerOverview]="movie.overview"
    [key]="movie.trailerKey"
  ></app-banner>

  <!-- Details Section -->
  <div class="px-6 md:px-12 py-10 space-y-10">
    <!-- Meta Row -->
    <div class="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm md:text-base text-neutral-300">
      <span class="text-white font-semibold text-lg md:text-xl">{{ movie.title }}</span>
      <span class="hidden md:inline">•</span>
      <span>{{ movie.releaseYear }}</span>
      <span class="hidden md:inline">•</span>
      <span>{{ movie.rating }}</span>
      <span class="hidden md:inline">•</span>
      <span>{{ movie.duration }}</span>
    </div>

    <!-- Genres -->
    <div class="flex flex-wrap gap-2">
      <span
        *ngFor="let genre of movie.genres"
        class="px-3 py-1 rounded-full bg-white/10 text-white text-xs md:text-sm hover-scale"
      >
        {{ genre }}
      </span>
    </div>

    <!-- Synopsis -->
    <div class="max-w-3xl">
      <h3 class="text-xl font-semibold mb-2">About</h3>
      <p class="text-neutral-300 leading-relaxed line-clamp-4 md:line-clamp-3">
        {{ movie.overview }}
      </p>
    </div>

    <!-- Cast -->
    <div class="space-y-4">
      <h3 class="text-xl font-semibold">Cast</h3>
      <div class="flex flex-wrap gap-3">
        <div
          *ngFor="let person of movie.cast"
          class="bg-white/5 border border-white/10 rounded px-4 py-2 hover-scale"
        >
          <div class="text-sm font-medium text-white">{{ person.name }}</div>
          <div class="text-xs text-neutral-400">{{ person.role }}</div>
        </div>
      </div>
    </div>

    <!-- Similar Movies -->
    <div class="space-y-4">
      <h3 class="text-xl font-semibold">More Like This</h3>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
        <div
          *ngFor="let m of similarMovies"
          class="group bg-white/5 border border-white/10 rounded overflow-hidden hover-scale"
        >
          <div class="relative w-full h-48">
            <img [src]="m.posterUrl" [alt]="m.title" class="w-full h-full object-cover" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
          </div>
          <div class="p-3">
            <div class="text-sm font-semibold text-white truncate">{{ m.title }}</div>
            <div class="text-xs text-neutral-400">{{ m.year }}</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
