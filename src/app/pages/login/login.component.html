<div class="relative w-full h-screen overflow-hidden">
  <!-- Background with animated overlay gradient -->
  <div class="absolute w-full h-full bg-gradient-to-t from-black/80 via-black/60 to-transparent z-10 animate-pulse-slow"></div>
  
  <!-- Video background for more dynamic feel -->
  <div class="absolute w-full h-full overflow-hidden">
    <img
      src="https://assets.nflxext.com/ffe/siteui/vlv3/dace47b4-a5cb-4368-80fe-c26f3e77d540/becb4b4a-fa87-47ab-b92b-aae2c1c6d6f7/SG-en-20231023-popsignuptwoweeks-perspective_alpha_website_small.jpg"
      alt="Netflix background"
      class="w-full h-full object-cover transform scale-105 animate-slow-zoom">
  </div>
  
  <!-- Netflix Logo with hover effect -->
  <div class="absolute top-6 left-8 z-20">
    <svg class="w-32 h-12 text-red-600 fill-current hover:text-red-500 transition-colors duration-300" viewBox="0 0 111 30" xmlns="http://www.w3.org/2000/svg">
      <path d="M105.062 14.28L111 30c-1.75-.25-3.499-.563-5.28-.845l-3.345-8.686-3.437 7.969c-1.687-.282-3.344-.376-5.031-.595l6.031-13.75L94.468 0h5.063l3.062 7.874L105.875 0h5.124l-5.937 14.28zM90.47 0h-4.594v27.25c1.5.094 3.062.156 4.594.343V0zm-8.563 26.937c-4.187-.281-8.375-.53-12.656-.625V0h4.687v21.875c2.688.062 5.375.28 7.969.405v4.657zM64.25 10.657v4.687h-6.406V26H53.22V0h13.125v4.687h-8.5v5.97h6.406zm-18.906-5.97V26.25c-1.563 0-3.156 0-4.688.062V4.687h-4.844V0h14.406v4.687h-4.874zM30.75 15.593c-2.062 0-4.5 0-6.25.095v6.968c2.75-.188 5.5-.406 8.281-.5v4.5l-12.968 1.032V0H32.78v4.687H24.5V11c1.813 0 4.594-.094 6.25-.094v4.688zM4.78 12.968v16.375C3.094 29.531 1.593 29.75 0 30V0h4.469l6.093 17.032V0h4.688v28.062c-1.656.282-3.344.376-5.125.625L4.78 12.968z"></path>
    </svg>
  </div>
  
  <!-- Modern Login Box with Glass Morphism -->
  <div class="absolute inset-0 flex items-center justify-center z-20">
    <div class="w-full max-w-md px-8 py-10 bg-black/75 backdrop-blur-sm text-white rounded-lg shadow-2xl border border-white/10 transform transition-all duration-300 hover:shadow-red-600/30 mx-4 flex flex-col items-center">
      <h1 class="font-bold text-3xl py-4 text-center bg-gradient-to-r from-red-600 to-red-400 bg-clip-text text-transparent">Welcome Back</h1>
      <p class="text-gray-300 mb-6 text-center">Sign in to continue to your entertainment</p>
      
      <!-- Google Sign In with improved styling -->
      <div class="flex justify-center  mb-6">
        <asl-google-signin-button 
          type="standard" 
          size="large" 
          shape="pill" 
          theme="filled_black"
          class="transform hover:scale-105 transition-transform duration-300">
        </asl-google-signin-button>
      </div>
      
      <!-- Divider -->
      <div class="flex items-center w-full my-4">
        <div class="flex-grow h-px bg-gray-600"></div>
        <span class="px-3 text-sm text-gray-400">or</span>
        <div class="flex-grow h-px bg-gray-600"></div>
      </div>
      
      <!-- Guest option -->
      <button class="w-full py-3 px-4 bg-transparent border border-white/30 rounded-md hover:bg-white/10 transition-colors duration-300 mb-6 flex items-center justify-center">
        <span class="mr-2">👤</span>
        Continue as Guest
      </button>
      
      <!-- Help text -->
      <p class="text-sm text-gray-400 mt-4">
        New to MovieFlix? <a href="#" class="text-red-500 hover:underline">Sign up now</a>
      </p>
    </div>
  </div>
  
  <!-- Floating movie posters for decoration -->
  <div class="absolute bottom-4 right-4 z-10 opacity-70 hidden md:block">
    <div class="grid grid-cols-3 gap-2">
      <div class="w-16 h-24 bg-gray-800 rounded-md shadow-lg transform rotate-3 animate-float"></div>
      <div class="w-16 h-24 bg-gray-800 rounded-md shadow-lg transform -rotate-2 animate-float-delayed"></div>
      <div class="w-16 h-24 bg-gray-800 rounded-md shadow-lg transform rotate-6 animate-float-more-delayed"></div>
    </div>
  </div>
</div>
